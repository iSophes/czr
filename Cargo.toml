[package]
name = "czr"
version = "1.0.0"
edition = "2024"
authors = ["Sophie B <sophie@astrofoxstudios.com>"]
readme = "README.md"
description = "Git helper, inspired by cz-git. Pronounced \"cesar\" (like Julius Cesar!)"
license = "MIT"
keywords = ["cli", "git", "helper", "util"]
categories = ["command-line-utilities"]
homepage = "https://github.com/isophes/czr"
repository = "https://github.com/isophes/czr"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
config = "0.15.25"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dirs = "6.0.0"
owo-colors = "4.3.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
